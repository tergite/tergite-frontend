# The stack dev/perf/record.sh loads: MSS built from this working tree, on the e2e fixtures' config
---
name: tergite-perf

services:
  tergite-mongo:
    image: mongo:8.0.30
    ports:
      - "27019:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 2s
      timeout: 5s
      retries: 30

  tergite-redis:
    image: redis:8.4.0
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 3s
      retries: 30

  mss:
    build:
      context: ../../apps/tergite-mss
    depends_on:
      tergite-mongo:
        condition: service_healthy
      tergite-redis:
        condition: service_healthy
    ports:
      - "8002:80"
    environment:
      - MSS_CONFIG_FILE=/code/mss-config.toml
      - PRIVATE_KEY_FILE=/code/private-mss-key.pem
    volumes:
      # the fixture config with its OpenID placeholders filled in, as record.sh writes it
      - ${PERF_MSS_CONFIG_FILE:?}:/code/mss-config.toml:ro
      - ../../apps/tergite-dashboard/cypress/fixtures/private-mss-key.pem:/code/private-mss-key.pem:ro
      # the config names each backend's key as bcc_certs/public-<name>-key.pem
      - ../../apps/tergite-dashboard/cypress/fixtures:/code/bcc_certs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/health || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 60
