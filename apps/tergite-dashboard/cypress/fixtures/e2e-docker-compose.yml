      - ./pingu.seed.toml:/code/calibration.seed.toml:ro
      - ./public-mss-key.pem:/code/public-mss-key.pem:ro
      - ./private-pingu-key.pem:/code/private-bcc-key.pem:ro
      - ./backend_db.sql:/code/backend_db.sql:ro
      - ./quantify-config.json:/code/quantify-config.json:ro
      - ./quantify-metadata.yml:/code/quantify-metadata.yml:ro
      - ./pingu.device_config.calib.toml:/code/device_config.calib.toml:ro
      - ./node_config.calib.toml:/code/node_config.calib.toml:ro
      - ./pingu.spi_config.calib.toml:/code/spi_config.calib.toml:ro
    networks:
      - tergite-frontend-e2e
    env_file:
      - .env

  pegu:
    restart: always
    platform: linux/amd64
    depends_on:
      loke:
        condition: service_healthy
      mss:
        condition: service_healthy
      tergite-redis:
        condition: service_healthy
    image: "tergite/tergite-backend-with-quantify-e2e:frontend-e2e"
    pull_policy: never
    logging:
