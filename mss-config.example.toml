# MSS's configuration. As it is, it runs MSS for development on this machine: copy it to
# mss-config.toml beside main.py. The lines marked PRODUCTION say what a deployment changes.

[general]
# the port on which MSS is running
mss_port = 8002
# the environment MSS runs in: development, staging, test or production; default = production.
# `npm run dev` refuses to seed, that is clear, a production database.
# PRODUCTION: production
environment = "development"
# For datetime precisions; number of additional components of the time to include
# See https://docs.python.org/3/library/datetime.html#datetime.datetime.isoformat
# <any of 'milliseconds', 'auto', 'microseconds', 'seconds', 'minutes', 'hours'>; default = auto
datetime_precision = "auto"
# the password of the private key file, private-mss-key.pem; unset for an unencrypted key.
# PRODUCTION: encrypt the key and set its password
# private_key_password = "some-secret-password"
# time-to-live for the nonce; defaults to 5 minutes
bcc_nonce_ttl = 300

[database]
# the database's name, used when the url names none
name = "tergite"
# database URI: mongodb:// or mongodb+srv://, or a SQLAlchemy URL with an async driver
# (postgresql+asyncpg://, sqlite+aiosqlite://), which `mss start` and `mss migrate` migrate with Alembic.
# This one is a SQLite file in the folder MSS starts in.
# PRODUCTION: mongodb://user:pass@host:port or postgresql+asyncpg://user:pass@host:port/tergite
url = "sqlite+aiosqlite:///db.sqlite3"

# Add backends in the form: Note: [[...]] creates an array of tables
[[backends]]
# this name of the backend computer that will be accessible from tergite.qiskit and from webGUI
name = "simulator"
# the URL where this backend is running; here a tergite-backend on this machine, if any
url = "http://127.0.0.1:8000"
# request timeout in seconds beyond which a timeout error is raised; default = 10
timeout = 10
# the backend's public key; a relative path is in the folder MSS starts in
public_key_path = "public-backend-key.pem"
# the public url for the backend; defaults to the 'url' if not set but can be set to say a reverse proxy
# public_url = "http://proxy.example.com/simulator"
# Whether we should always check source IP address of connections from this backend
# default: true
is_strict_ip = false

[projects]
# QPU seconds a personal project is created with. Default 0 keeps an unconfigured
# deployment behaving as it did before personal projects existed; set a non-zero
# value to let every new user start with usable time.
personal_qpu_seconds = 0
# notify the project admin when remaining QPU seconds fall below this; default = 600
qpu_seconds_low_threshold = 600

[notices]
# days a notice is kept before the TTL index removes it; default = 90
retention_days = 90
# base URL of the dashboard, which MSS serves at /ui, used for the deep links in notice emails.
# Required whenever [email] is set, since a mail with a dead link is worse than no mail.
# PRODUCTION: https://mss.example.com/ui
dashboard_url = "http://127.0.0.1:8002/ui"
# seconds between sweeps of the pending-email outbox; default = 60
email_sweep_interval = 60
# attempts per notice email before it is marked failed; default = 3
email_retry_limit = 3
# the name of the application as will be seen in the email notices; default = Tergite
app_name = "WACQT"

# Outbound SMTP. Without this section notices stay in-app only:
# emails are then never queued, and per-user email preferences have no effect.
# PRODUCTION: set it
# [email]
# hostname = "smtp.example.com"
# port = 587
# username = "mss@example.com"
# password = "some hidden secret"
# # whether to upgrade the connection with STARTTLS; default = true
# use_tls = true
# from_address = "no-reply@example.com"
# # display name on the From header; default = "Tergite"
# from_name = "Tergite"
# # seconds to wait on the SMTP server before giving up; default = 10
# timeout = 10

[auth]
# Secret for signing JWT tokens. https://jwt.io/introduction
# PRODUCTION: a long random secret, e.g. `openssl rand -hex 32`
jwt_secret = "development-only-secret"
# Time-to-live for the JWT tokens created by this app, default=3600
jwt_ttl = 3600
# domain to be set in the cookie, to limit its use to only that domain; the host the dashboard is
# opened at. https://developer.mozilla.org/en-US/docs/Web/HTTP/Cookies
# PRODUCTION: the deployment's domain, e.g. mss.example.com
cookie_domain = "127.0.0.1"
# name of the cookie to be used when authenticating
cookie_name = "tergiteauth"

# The OAuth2 or OpenID providers users log in with. In development, `npm run dev` serves
# http://127.0.0.1:8002/ui/dev-login.html, which logs in as any seeded user without one.
# PRODUCTION: add at least one
#
# [[auth.clients]]
# # the name in the URLs of this client, e.g. 'github' as in mss.example.com/auth/github/
# name = "github"
# # Register an app with the provider for its client id and secret, and for OpenID its
# # openid_configuration_endpoint:
# # GitHub: https://docs.github.com/en/apps/oauth-apps/building-oauth-apps/authorizing-oauth-apps
# # Microsoft: https://learn.microsoft.com/en-us/azure/active-directory/develop/quickstart-web-app-python-sign-in?tabs=windows
# # Puhuri (OpenID): https://webapp.prod.puhuri.eduteams.org/sp_request
# client_id = "some-github-obtained-client-id"
# client_secret = "some-github-obtained-client-secret"
# # the URL on MSS the provider redirects to after the login: <MSS's URL>/auth/<name>/callback
# redirect_url = "https://mss.example.com/auth/github/callback"
# # one of 'microsoft', 'google', 'github', 'okta', 'openid'
# client_type = "github"
# # the emails allowed to log in with this client; default = ".*"
# email_regex = "^(john\\.doe|jane)@example\\.com$"
# # the domain of the emails of the users directed to this client
# email_domain = "example.com"
# # the roles every user who logs in with this client gets: any of "admin", "user",
# # "researcher", "partner"; default = ["user"]
# roles = ["user"]
# # other client-type specific arguments, as the `httpx_oauth.clients` module's clients take them,
# # e.g. for OpenID
# # openid_configuration_endpoint = "https://example.com/.well-known/openid-configuration"
# # or GitHub's scopes
# # scopes = ["user:email"]
# # whether a user is matched to an existing user of the same email, who logged in with
# # another provider; else that user cannot log in with this one. default = false
# associate_by_email = false
# # whether a user who logs in is considered verified; default = true
# is_verified_by_default = true
