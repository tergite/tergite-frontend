# backend_config.toml
[general_config]
name = "qiskit_pulse_1q"
version = "1.0.0"
is_active = true
characterized = true
open_pulse = true
simulator = true
online_date = "2024-09-11T18:07:31"
num_qubits = 1
num_couplers = 0
num_resonators = 1
description = "A simulated transmon"
dt = 1e-9
dtm = 1e-9

[device_config]
# config names for specification of calibration values
# probably not entirely true for everything herein but mostly so
discriminators = [ "lda" ]

qubit_ids = [ "q0" ]


# the spacial [x,y] coordinates of the qubits
coordinates = [ [ 0, 0 ] ]

meas_map = [ [ 0 ] ]

qubit_parameters = [
  "id",
  "x_position",
  "y_position",
  "xy_drive_line",
  "z_drive_line",
  "frequency",
  "pi_pulse_amplitude",
  "pi_pulse_duration",
  "pi_pulse_motzoi",
  "pulse_type",
  "pulse_sigma",
  "t1_decoherence",
  "t2_decoherence"
]
resonator_parameters = [
  "id",
  "x_position",
  "y_position",
  "readout_line",
  "acq_delay",
  "acq_integration_time",
  "frequency",
  "pulse_delay",
  "pulse_duration",
  "pulse_type",
  "pulse_amplitude"
]

coupler_parameters = [
  "id",
  "x_position",
  "y_position",
  "xy_drive_line",
  "z_drive_line",
  "frequency",
  "pi_pulse_amplitude",
  "pi_pulse_duration",
  "pi_pulse_motzoi",
  "pulse_type",
  "pulse_sigma",
  "t1_decoherence",
  "t2_decoherence"
]

[device_config.discriminator_parameters]
lda = [
  "coef_0",
  "coef_1",
  "intercept"
]

# Configuration for Basis gates
[gates.x]
qasm_def = "gate x q { U(pi, 0, pi) q; }"
parameters = [ ]
coupling_map = [[0]]

# a simulated device, whose jobs a worker runs on this chip behind dummy clusters; the e2e
# serves only its API
[simulator.chip]
readout_noise = 0.002

[simulator.chip.qubits.q0]
frequency = 4.5116e9
anharmonicity = -0.21e9
rabi_frequency = 1.62e8
t1 = 6e-5
t2 = 5e-5

[simulator.chip.resonators.q0]
frequency = 7.2601e9
dispersive_shift = -0.5e6
bare_frequency = 7.2581e9
critical_amplitude = 0.4
internal_quality = 60000
coupling_quality = 20000
amplitude = 0.3
phase = 0.4
