# backend_config.toml
[general_config]
name = "qiskit_pulse_2q"
is_active = true
characterized = true
open_pulse = true
simulator = true
version = "1.0.0"
online_date = "2024-10-09T00:00:00"
num_qubits = 2
num_couplers = 1
num_resonators = 2
description = "Two simulated transmons and their coupler"
dt = 1e-9
dtm = 1e-9

[device_config]
discriminators = [ "lda" ]
qubit_ids = [ "q0", "q1" ]
meas_map = [ [ 0 ], [ 1 ] ]
coordinates = [
  [0, 0],
  [1, 0]
]

qubit_parameters = [
  "id",
  "x_position",
  "y_position",
  "xy_drive_line",
  "z_drive_line",
  "frequency",
  "pi_pulse_amplitude",
  "pi_pulse_duration",
  "pi_pulse_motzoi",
  "pulse_type",
  "pulse_sigma",
  "t1_decoherence",
  "t2_decoherence"
]
resonator_parameters = [
  "id",
  "x_position",
  "y_position",
  "readout_line",
  "acq_delay",
  "acq_integration_time",
  "frequency",
  "pulse_delay",
  "pulse_duration",
  "pulse_type",
  "pulse_amplitude"
]

coupler_parameters = [
  "id",
  "frequency",
  "frequency_detuning",
  "anharmonicity",
  "coupling_strength_02",
  "coupling_strength_12",
  "cz_pulse_amplitude",
  "cz_pulse_dc_bias",
  "cz_pulse_phase_offset",
  "cz_pulse_duration_before",
  "cz_pulse_duration_rise",
  "cz_pulse_duration_constant",
  "control_rz_lambda",
  "target_rz_lambda",
  "pulse_type"
]

[device_config.discriminator_parameters]
lda = [
  "coef_0",
  "coef_1",
  "intercept"
]

[device_config.coupling_dict]
u0 = ["q0", "q1"]

[gates.x]
coupling_map = [ [ 0, 1], [1, 0] ]
qasm_def = "gate x q { U(pi, 0, pi) q; }"
parameters = [ ]

# a simulated device, whose jobs a worker runs on this chip behind dummy clusters; the e2e
# serves only its API
[simulator.chip]
readout_noise = 0.002

[simulator.chip.qubits.q0]
frequency = 4.5116e9
anharmonicity = -0.21e9
rabi_frequency = 1.62e8
t1 = 6e-5
t2 = 5e-5

[simulator.chip.qubits.q1]
frequency = 5.2003e9
anharmonicity = -0.2e9
rabi_frequency = 1.6e8
t1 = 6e-5
t2 = 5e-5

[simulator.chip.resonators.q0]
frequency = 7.2601e9
dispersive_shift = -0.5e6
bare_frequency = 7.2581e9
critical_amplitude = 0.4
internal_quality = 60000
coupling_quality = 20000
amplitude = 0.3
phase = 0.4

[simulator.chip.resonators.q1]
frequency = 7.2002e9
dispersive_shift = -0.45e6
bare_frequency = 7.1982e9
critical_amplitude = 0.4
internal_quality = 60000
coupling_quality = 20000
amplitude = 0.3
phase = -1.1

[simulator.chip.couplers.q0_q1]
max_frequency = 7.5e9
anharmonicity = -0.15e9
flux_offset = 0.25
flux_per_current = 100.0
flux_per_amplitude = 0.1

[simulator.chip.couplers.q0_q1.couplings]
q0 = 0.1e9
q1 = 0.1e9
