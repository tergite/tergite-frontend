[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tergite-mss"
authors = [
    {name = "Miroslav Dobsicek"},
    {name = "Martin Ahindura"},
]
maintainers = [
    {name = "Chalmers Next Labs AB", email = "contact@quantum.chalmersnextlabs.se"}
]
version = "2026.11.0-rc.10"
description = "the public API for the WACQT quantum computer."
readme = "README.md"
requires-python = ">=3.13"
keywords = ["quantum", "qiskit", "quantify"]
license = {file = "LICENSE.txt"}
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "fastapi~=0.115.12",
    "uvicorn>=0.31.1",
    "python-multipart>=0.0.9",
    "httpx~=0.27.2",
    "httpx-oauth>=0.15.1",
    "email-validator>=2.0.0.post2",
    "cryptography~=45.0.2",
    "websockets~=15.0.1",
    "loguru~=0.7.2",
    "aiosmtplib~=3.0.2",
    "sqlalchemy[asyncio]~=2.0",
    "asyncpg~=0.30",
    "aiosqlite~=0.21",
    "alembic~=1.16",
    "pymongo~=4.17.0",
    "pyjwt[crypto]~=2.10.1",
]

[project.optional-dependencies]
dev = [
    # formats, sorts the imports and finds what pyflakes did
    "ruff==0.15.1",
    # writes MSS's models of a backend's events from its spec, in dev/openapi
    "datamodel-code-generator>=0.34",
    "pytest>=7.4.0,<8.0.0",
    "pytest-lazy-fixture>=0.6.3",
    "pytest-freezegun>=0.4.2",
    "pytest-asyncio>=0.21.1,<0.23.0",
    "pytest-mock>=3.11.1",
    "pytest-cov>=4.1.0",
    "respx>=0.20.2",
    "filelock>=3.12.2",
    "setuptools",
    "asgi-lifespan>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/tergite/tergite-frontend/tree/main"
Repository = "https://github.com/tergite/tergite-frontend"
Documentation = "https://github.com/tergite/tergite-frontend/tree/main/docs"
Issues = "https://github.com/tergite/tergite-frontend/issues"
Changelog = "https://github.com/tergite/tergite-frontend/blob/main/CHANGELOG.md"

[project.scripts]
mss = "main:main"

[tool.setuptools]
# the mss command's, beside the packages
py-modules = ["main", "settings"]

[tool.setuptools.packages.find]
# migrations has no __init__.py, which Alembic loads by path; its mongodb JSONs come as the
# files git tracks in it
include = ["api*", "libs*", "services*", "utils*", "migrations*"]

[tool.ruff]
target-version = "py313"
# the dashboard
extend-exclude = ["ui"]

[tool.ruff.lint]
# pyflakes' findings and isort's order, as black, isort and pyflakes checked before
select = ["F", "I"]

[tool.ruff.lint.isort]
# the top-level packages' names are generic, so ruff cannot tell them from third parties'
known-first-party = ["api", "libs", "services", "utils", "migrations", "main", "settings", "tests", "dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
asyncio_mode = "auto"
