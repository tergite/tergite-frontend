name: MSS CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "apps/tergite-mss/**"
      - "!apps/tergite-mss/ui/**"
  pull_request:
    paths:
      - "apps/tergite-mss/**"
      - "!apps/tergite-mss/ui/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]

    services:
      mongodb:
        image: mongo
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand("ping").ok' | mongosh --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --name mongo_container

      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tergite
          POSTGRES_PASSWORD: tergite
          POSTGRES_DB: tergite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tergite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: |
          cd apps/tergite-mss
          pip install --upgrade pip
          pip install ."[dev]"
          black --check .
          pyflakes api services utils libs migrations settings.py tests dev
          pytest
