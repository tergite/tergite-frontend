name: MSS CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
    paths-ignore:
      - "ui/**"
  pull_request:
    paths-ignore:
      - "ui/**"

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]

    services:
      mongodb:
        image: mongo
        ports:
          - 27017:27017
        options: >-
          --health-cmd "echo 'db.runCommand("ping").ok' | mongosh --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
          --name mongo_container

      redis:
        image: redis
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: tergite
          POSTGRES_PASSWORD: tergite
          POSTGRES_DB: tergite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tergite"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint
        env:
          UV_PYTHON: ${{ matrix.python-version }}
        run: |
          uv sync --frozen --extra dev
          uv run black --check .
          uv run isort --check-only .
          uv run pyflakes api services utils libs migrations settings.py main.py tests dev
      - name: Run tests
        run: uv run pytest
