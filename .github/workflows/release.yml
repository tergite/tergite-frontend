name: Release
# Builds MSS's deb for amd64 and pkg for macOS arm64, with the dashboard it serves at /ui, each on that platform since Nuitka
# cannot cross-compile, smoke-tests them, and attaches them to the GitHub release of a v* tag.
# Run by hand, it leaves them as the run's artifacts instead. The rpm, apk and Windows
# packaging in pkg/ is kept but not built.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp on the installers, e.g. 2026.10.0"
        required: true

env:
  # the Python the binary is built and tested with; uv would otherwise take the newest it can
  # download, whose wheels may not exist yet
  UV_PYTHON: "3.13"
  # uv's own build of it, as Nuitka refuses e.g. Homebrew's on the macOS runners
  UV_MANAGED_PYTHON: "1"

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          RAW_VERSION: ${{ inputs.version || github.ref_name }}
        run: echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"

  dashboard:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: |
          npm ci
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: ui/dist

  linux:
    needs: [version, dashboard]
    # its glibc 2.39 is the oldest the binary then runs on: Debian 13 and Ubuntu 24.04 onwards
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: amd64
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: ui/dist
      # the runner's apt lists can be out of date, for these and the deb's dependencies alike
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ccache patchelf
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/Nuitka
          key: mss-nuitka-linux-${{ github.sha }}
          restore-keys: mss-nuitka-linux-
      - name: Build the binary
        run: |
          uv sync --frozen --extra dev
          uv run nuitka --assume-yes-for-downloads main.py
      # also after a failed or timed-out build, so that the next one picks up where it stopped
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/Nuitka
          key: mss-nuitka-linux-${{ github.sha }}
      - name: Package it
        run: |
          # nfpm takes a -t that does not exist yet for a file to write
          mkdir -p dist
          docker run --rm -e VERSION -e ARCH -v "$PWD":/src -w /src \
            goreleaser/nfpm:v2.48.0 package -f pkg/nfpm.yaml -p deb -t dist/
      - name: Install the package and migrate with it
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ./dist/*.deb
          pkg/smoke-test.sh /usr/bin/tergite-mss
      - uses: actions/upload-artifact@v4
        with:
          name: mss-linux-amd64
          path: dist/*

  macos:
    needs: [version, dashboard]
    runs-on: macos-14
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dashboard
          path: ui/dist
      # Nuitka's own download of ccache is Intel-only, and its clang then fails under Rosetta
      - run: brew install ccache
      - uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: mss-nuitka-macos-${{ github.sha }}
          restore-keys: mss-nuitka-macos-
      - name: Build the binary
        run: |
          uv sync --frozen --extra dev
          uv run nuitka --assume-yes-for-downloads main.py
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/Nuitka
          key: mss-nuitka-macos-${{ github.sha }}
      - run: pkg/macos/build.sh
      - name: Install the package and migrate with it
        run: |
          sudo installer -pkg "dist/tergite-mss-$VERSION-macos-arm64.pkg" -target /
          dscl . -read /Users/_tergite-mss UniqueID
          pkg/smoke-test.sh /usr/local/bin/tergite-mss
          sudo /usr/local/share/tergite-mss/uninstall.sh
      - uses: actions/upload-artifact@v4
        with:
          name: mss-macos-arm64
          path: dist/*.pkg

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [linux, macos]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: mss-*
          path: dist
          merge-multiple: true
      - name: Attach the installers to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --notes "See CHANGELOG.md."
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
