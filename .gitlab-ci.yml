stages:
  - lint
  - tests
  - e2e
  - package
  - release

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  # pinned with its checksum, so that what packages a release is checked against this file
  NFPM_VERSION: "2.48.0"
  NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750

.setup_dashboard: &setup_dashboard
  image: mcr.microsoft.com/playwright:v1.64.0-noble
  variables:
    FF_NETWORK_PER_BUILD: 1
  cache:
    key:
      files:
        - ui/package-lock.json
    paths:
      - ui/.npm/
  before_script:
    - cd ui
    - npm ci --cache .npm --prefer-offline

.setup_mss: &setup_mss
  image: python:$VERSION
  services:
    - name: mongo:8.2.3
      alias: mongo
    - name: postgres:17
      alias: postgres
  variables:
    FF_NETWORK_PER_BUILD: 1
    UV_PYTHON: $VERSION
    POSTGRES_USER: tergite
    POSTGRES_PASSWORD: tergite
    POSTGRES_DB: tergite_test
    TEST_POSTGRES_URL: postgresql+asyncpg://tergite:tergite@postgres:5432/tergite_test
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .cache/uv
  before_script:
    # on the port the test config names
    - apt-get update -qq && apt-get install -y -qq redis-server
    - redis-server --daemonize yes
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync --frozen --extra dev
    # This checks the ulimit of the job container
    - ulimit -n
    # Update test fixtures to point to the mongo service
    - sed -i 's/mongodb:\/\/localhost:27017/mongodb:\/\/mongo:27017/g' tests/fixtures/*
  parallel:
    matrix:
      - VERSION: ["3.13"]

lint dashboard:
  needs: []
  stage: lint
  <<: *setup_dashboard
  script:
    - npm run lint
    - npm run check:api

test dashboard:
  needs: []
  stage: tests
  <<: *setup_dashboard
  script:
    - npm run test

# the dashboard's Playwright suite against MSS and the backends, seeded from its fixtures
e2e:
  needs: []
  image: mcr.microsoft.com/playwright:v1.64.0-noble
  stage: e2e
  variables:
    BACKEND_REPO: "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/tergite-backend.git"
    # this branch, tag or merge request's source branch, where the backend has one of that name
    BACKEND_BRANCH: $CI_COMMIT_REF_NAME
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v.*$/
  before_script:
    - apt-get update -qq
    - apt-get install -y -qq curl gnupg git jq redis-server sqlite3
    - curl -fsSL https://www.mongodb.org/static/pgp/server-8.0.asc |
      gpg --dearmor -o /usr/share/keyrings/mongodb-server-8.0.gpg
    - echo "deb [ arch=amd64,arm64 signed-by=/usr/share/keyrings/mongodb-server-8.0.gpg ] https://repo.mongodb.org/apt/ubuntu noble/mongodb-org/8.0 multiverse" >
      /etc/apt/sources.list.d/mongodb-org-8.0.list
    - apt-get update -qq && apt-get install -y -qq mongodb-org
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - export PATH="$HOME/.local/bin:$PATH"
  script:
    - ./dev/e2e_native_test.sh

lint mss:
  needs: []
  stage: lint
  <<: *setup_mss
  script:
    - uv run black --check .
    - uv run isort --check-only .
    - uv run pyflakes api services utils libs migrations settings.py main.py tests dev

test mss:
  needs: []
  stage: tests
  <<: *setup_mss
  script:
    - echo "PYTEST_ARGS='${PYTEST_ARGS:-}'"
    - uv run pytest ${PYTEST_ARGS:-}

# On a v* tag, as .github/workflows/release.yml does on GitHub: MSS's deb and macOS
# installer, with the dashboard it serves at /ui, each built on its platform as Nuitka cannot
# cross-compile, uploaded to this project's package registry and linked from the release.
.release: &release
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/

build dashboard:
  <<: *release
  stage: package
  needs: []
  image: node:20
  script:
    - cd ui
    - npm ci
    - npm run build
  artifacts:
    paths:
      - ui/dist/
    expire_in: 1 week

.package_mss: &package_mss
  <<: *release
  stage: package
  needs: ["build dashboard"]
  timeout: 1h
  variables:
    # the Python the binary is built with; uv would otherwise take the newest it can download
    UV_PYTHON: "3.13"
    # uv's own build of it, as Nuitka refuses e.g. Homebrew's on a Mac
    UV_MANAGED_PYTHON: "1"
    NUITKA_CACHE_DIR: "$CI_PROJECT_DIR/.cache/Nuitka"
  cache:
    key: nuitka-$CI_JOB_NAME_SLUG
    paths:
      - .cache/Nuitka
    # also after a failed or timed-out build, so that the next one picks up where it stopped
    when: always
  artifacts:
    paths:
      - published/
    expire_in: 1 year

# its glibc 2.39 is the oldest the binary then runs on: Debian 13 and Ubuntu 24.04 onwards
package mss linux:
  <<: *package_mss
  image: ubuntu:24.04
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    - pkg/build-linux.sh
    - curl -fsSL -o /tmp/nfpm.tar.gz "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
    - echo "$NFPM_SHA256  /tmp/nfpm.tar.gz" | sha256sum -c -
    - tar -xzf /tmp/nfpm.tar.gz -C /usr/local/bin nfpm
    - mkdir -p dist
    - ARCH=amd64 nfpm package -f pkg/nfpm.yaml -p deb -t dist/
    - DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ./dist/*.deb
    - pkg/smoke-test.sh /usr/bin/tergite-mss
    - pkg/publish.sh dist/*.deb

# A Mac with uv and ccache, registered with the shell executor and tagged macos; only where
# PUBLISH_MACOS_ARM64 is exactly true, so that a pipeline without such a runner does not wait
# on it. SIGN_IDENTITY, set in the CI/CD variables, signs the installer.
package mss macos:
  <<: *package_mss
  tags: [macos]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/ && $PUBLISH_MACOS_ARM64 == "true"
  script:
    - export VERSION=${CI_COMMIT_TAG#v}
    - uv sync --frozen --extra dev
    - uv run nuitka --assume-yes-for-downloads main.py
    # the folder the installer installs, as installing it needs the root a shell runner lacks
    - pkg/smoke-test.sh main.dist/mss
    - pkg/macos/build.sh
    - pkg/publish.sh dist/*.pkg

release:
  <<: *release
  stage: release
  image: alpine:3.20
  needs:
    - job: package mss linux
    - job: package mss macos
      optional: true
  script:
    - apk add --no-cache bash curl jq
    - pkg/release.sh
